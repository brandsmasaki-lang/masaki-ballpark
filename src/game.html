<title>草野球ドリーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* layout: one-screen portrait game. HUD window, pixel ballpark map, news ticker, command buttons; menus open as framed windows */
:root{
  --sky:#3d6fb8; --sky-deep:#26497f;
  --win:#fff6de; --win-ink:#33220f; --win-line:#3a2714; --win-sub:#f3e1b8; --win-dash:#d3b585;
  --head:#e8823a; --head-ink:#ffffff;
  --btn:#ffd45c; --btn-sub:#f6e7c4; --btn-ink:#33220f; --btn-off:#ddd3bf;
  --good:#23803a; --bad:#c8402f; --muted:#7a6244; --money:#23803a;
  --ticker:#1e2943; --ticker-ink:#ffeaa8;
  --board:#1f4d2b; --board-ink:#f4fbef; --board-hi:#ffe14a;
  --font-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;
  --font-pixel:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
table{color:inherit;font:inherit}
body{background:var(--sky);color:var(--win-ink);font-family:var(--font-ui);font-weight:500;font-size:15px;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
b,strong{font-weight:800}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{background:var(--win);border:3px solid var(--win-line);border-radius:10px;padding:5px 10px 6px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-variant-numeric:tabular-nums;line-height:1.35}
.hud .big{font-size:17px;font-weight:800}
.hud .r{text-align:right}
.hud .money{color:var(--money)}
.hud .money.neg{color:var(--bad)}
.hud .wide{grid-column:1/3;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .wide b{color:var(--win-ink)}
.prog{grid-column:1/3;height:5px;background:var(--win-sub);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--head)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cwrap{position:relative;border:3px solid var(--win-line);border-radius:8px;overflow:hidden;background:#7cc35f}
.cwrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:1px 0 #3a2714,-1px 0 #3a2714,0 1px #3a2714,0 -1px #3a2714,1px 1px #3a2714;animation:fl 1.4s ease-out forwards}
.fl.up{color:#ffe14a}.fl.money{color:#a6ff8f}.fl.zz{color:#cfe3ff}.fl.big{font-size:18px}
@keyframes fl{from{opacity:1;margin-top:0}70%{opacity:1}to{opacity:0;margin-top:-22px}}
.hint{position:absolute;left:6px;right:6px;bottom:6px;background:var(--ticker);color:var(--ticker-ink);border:2px solid var(--win-line);border-radius:8px;font-size:14px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:auto}
.ticker{background:var(--ticker);color:var(--ticker-ink);border:3px solid var(--win-line);border-radius:8px;padding:5px 10px;font-size:14px;min-height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.btn{font-family:inherit;font-weight:800;font-size:16px;background:var(--btn);color:var(--btn-ink);border:3px solid var(--win-line);border-radius:8px;padding:8px 10px;box-shadow:0 3px 0 var(--win-line);cursor:pointer;line-height:1.25}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--win-line)}
.btn.sub{background:var(--btn-sub)}
.btn.on{background:var(--head);color:var(--head-ink)}
.btn.off{background:var(--btn-off);color:var(--muted)}
.btn.sm{font-size:14px;padding:4px 10px;border-width:2px;box-shadow:0 2px 0 var(--win-line)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.menu .btn{padding:10px 4px}
.ov{position:fixed;inset:0;background:rgba(18,22,40,.55);display:flex;align-items:center;justify-content:center;z-index:30;box-sizing:border-box;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.win{background:var(--win);border:3px solid var(--win-line);border-radius:10px;box-shadow:0 4px 0 var(--win-line);width:100%;max-width:430px;max-height:100%;display:flex;flex-direction:column}
.win h2{margin:0;background:var(--head);color:var(--head-ink);font-size:17px;font-weight:800;padding:7px 12px;border-bottom:3px solid var(--win-line);border-radius:7px 7px 0 0;letter-spacing:.04em}
.wb{overflow:auto;padding:12px;font-size:15px;line-height:1.6;-webkit-overflow-scrolling:touch}
.wb p{margin:6px 0}
.wf{display:flex;gap:8px;padding:9px 12px;border-top:2px dashed var(--win-dash);justify-content:flex-end;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:2px dashed var(--win-dash);cursor:pointer}
.row:last-child{border-bottom:0}
.row.lock{opacity:.5;cursor:default}
.row.cur{background:var(--win-sub);border-radius:6px}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:800}
.row .sub{font-size:13px;color:var(--muted);line-height:1.5}
.row canvas.pic{width:28px;height:36px;image-rendering:pixelated;flex:none}
.rk{display:inline-block;min-width:1.25em;text-align:center;color:#fff;border-radius:4px;padding:0 3px;font-size:13px;font-weight:800;line-height:1.45;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.fat{display:inline-block;width:44px;height:7px;background:var(--win-sub);border:1px solid var(--win-line);vertical-align:middle;border-radius:2px;overflow:hidden}
.fat i{display:block;height:100%}
.stat{display:grid;grid-template-columns:5.4em 1.7em 3.6em 1fr;align-items:center;gap:6px;margin:5px 0;font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--win-sub);border:1px solid var(--win-line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--head)}
.note{font-size:13px;color:var(--muted)}
.bad{color:var(--bad)}.good{color:var(--good)}
.sec{font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:block;width:100%;text-align:left;font-size:15px;padding:7px 10px}
.opt small{display:block;font-size:12px;font-weight:500;opacity:.9;line-height:1.4}
table.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:4px 3px;border-bottom:2px dashed var(--win-dash);text-align:center}
select{font-family:inherit;font-size:15px;border:2px solid var(--win-line);border-radius:6px;background:var(--btn-sub);color:var(--win-ink);padding:3px 6px}
.portrait{width:56px;height:72px;image-rendering:pixelated;flex:none;background:var(--win-sub);border:2px solid var(--win-line);border-radius:6px}
/* match screen */
#match{position:fixed;inset:0;background:var(--sky-deep);z-index:20;display:flex;justify-content:center;box-sizing:border-box;padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mwrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:6px;min-height:0}
.sbw{background:var(--board);color:var(--board-ink);border:3px solid var(--win-line);border-radius:8px;padding:4px 6px;font-size:13px;overflow-x:auto}
table.sb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sb th,table.sb td{text-align:center;padding:1px 2px;font-weight:700}
table.sb th{color:#bfe0c4;font-size:11px}
table.sb td.tn{text-align:left;white-space:nowrap}
table.sb td.tn i{display:inline-block;width:9px;height:9px;margin-right:4px;border:1px solid #000;vertical-align:-1px}
table.sb td.tot{color:var(--board-hi);font-size:15px}
.sbst{display:flex;justify-content:space-between;padding:2px 2px 0;color:#d6ecd9;font-weight:700}
#mstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:24px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:2px 0 #3a2714,-2px 0 #3a2714,0 2px #3a2714,0 -2px #3a2714,2px 2px #3a2714;animation:pop .22s ease-out}
.banner.big{font-size:32px;color:#ffe14a}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5)}to{transform:translate(-50%,-50%) scale(1)}}
.mlog{background:var(--ticker);color:var(--ticker-ink);border:3px solid var(--win-line);border-radius:8px;padding:4px 10px;font-size:13px;line-height:1.55;height:4.65em;overflow:hidden}
.mlog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlog div:first-child{color:#fff}
.mctl{display:flex;gap:6px}
.mctl .btn{flex:1;font-size:14px;padding:7px 2px}
.mcmd{background:var(--win);border:3px solid var(--win-line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px}
.mcmd .lbl{font-size:12px;color:var(--muted);font-weight:800}
.mcmd .opts{display:flex;gap:5px}
.mcmd .opts .btn{flex:1;font-size:14px;padding:6px 2px}
#swing{font-size:22px;padding:12px;background:#ff6a4d;color:#fff}
#swing.ready{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}

/* title (草野球ドリーム) */
div#title{background:linear-gradient(#3f9be8 0%,#8fd0ff 46%,#cdeeff 62%,#7cc35f 62%,#5fae49 100%)}
#title .tcard{position:relative;z-index:1;gap:8px;margin:auto 0}
div#title{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.tlogo{width:min(100%,360px);display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));animation:logoIn .7s cubic-bezier(.2,1.5,.4,1) both,bob 3.2s ease-in-out .7s infinite}
@keyframes logoIn{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-5px)}}
.tstage{display:flex;align-items:flex-end;justify-content:center;width:100%;margin-top:-6px;padding:0 2px;box-sizing:border-box}
.tstage img{display:block;height:clamp(54px,17vw,76px);width:auto;margin:0 -1.2%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));animation:tUp .5s ease-out both,bobB 2.4s ease-in-out infinite}
.tstage .ts{height:clamp(34px,11vw,50px)}
.tstage img:nth-child(1){animation-delay:.25s,.8s}.tstage img:nth-child(2){animation-delay:.35s,1.1s;margin-bottom:14px}.tstage img:nth-child(3){animation-delay:.45s,1.4s}.tstage img:nth-child(4){animation-delay:.55s,1.0s;margin-bottom:10px}.tstage img:nth-child(5){animation-delay:.65s,1.3s}
@keyframes tUp{from{transform:translateY(40%);opacity:0}}
@keyframes tIn{from{transform:translateX(-60%);opacity:0}}
@keyframes tInR{from{transform:translateX(60%);opacity:0}}
@keyframes bobP{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes bobB{50%{transform:translateY(-6px) rotate(3deg)}}
.tcl{position:absolute;background:#fff;border-radius:40px;height:22px;opacity:.85;animation:drift 38s linear infinite}
.tcl::before{content:"";position:absolute;left:22%;top:-12px;width:46%;height:28px;background:#fff;border-radius:50%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#title .tsub{background:rgba(255,255,255,.9);border:3px solid var(--win-line);border-radius:10px;padding:6px 12px;color:var(--win-ink);font-weight:700}
#title .tbtns .btn,#title #tNew{font-size:18px;padding:11px}
#title .tver{font-size:13px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #26497f;margin-top:-4px;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
#title .tver .btn{font-size:13px;padding:4px 10px;background:#ff6a4d;color:#fff;animation:pulse .6s ease-in-out infinite alternate}
#title .tsum{display:block;font-size:13px;font-weight:600;line-height:1.5;margin-top:4px}
/* in-game pop-up confirm (sits on top of any window) */
#cfm{position:fixed;inset:0;z-index:70;background:rgba(10,14,30,.5);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.cfbox{background:var(--win);border:3px solid var(--win-line);border-radius:12px;width:100%;max-width:360px;box-shadow:0 6px 0 rgba(0,0,0,.25);overflow:hidden;animation:cfIn .16s ease-out}
@keyframes cfIn{from{transform:scale(.85);opacity:0}}
.cft{background:var(--head);color:var(--head-ink);font-weight:800;padding:7px 12px;font-size:16px}
.cfb{padding:10px 12px 0;line-height:1.6;max-height:62vh;overflow:auto}
.cfb p{margin:4px 0}
.cff{display:flex;gap:8px;padding:10px 12px 12px}
.cff .btn{flex:1}
.sslist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.btn.ssb{background:#8a2be2;color:#fff;font-size:12px;padding:2px 8px;margin-left:4px;vertical-align:1px}
/* match effects */
.cut{position:absolute;bottom:1%;width:56%;pointer-events:none;animation:cutR 1.7s ease-out forwards}
.cut.r{right:-3%}
.cut.l{left:-3%;animation-name:cutL}
.cut img{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.cut::before{content:"";position:absolute;inset:18% -40%;background:repeating-linear-gradient(100deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.55) 14px 17px);z-index:-1;border-radius:50%}
@keyframes cutR{0%{transform:translateX(110%)}14%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(6%);opacity:0}}
@keyframes cutL{0%{transform:translateX(-110%)}14%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(-6%);opacity:0}}
.cheer{position:absolute;inset:0;pointer-events:none}
.cheer i{position:absolute;width:3%;height:3.4%;border-radius:45% 45% 10% 10%;border:1px solid #1d140c;animation:jump .22s ease-in-out 10 alternate}
@keyframes jump{to{transform:translateY(-70%)}}
.cheer b{position:absolute;top:-3%;width:1.8%;height:2.4%;animation:conf 1.8s linear forwards}
@keyframes conf{to{transform:translateY(1200%) rotate(620deg);opacity:.3}}
.cheer .wa{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:28px;font-weight:800;color:#ffe14a;white-space:nowrap;text-shadow:2px 0 #3a2714,-2px 0 #3a2714,0 2px #3a2714,0 -2px #3a2714;animation:wa .25s ease-in-out 8 alternate}
@keyframes wa{to{transform:translateX(-50%) scale(1.18)}}
.fl.km{font-size:12px;color:#fff;background:rgba(29,20,12,.6);padding:0 5px;border-radius:6px;text-shadow:none}
.fl.zudon{font-size:34px;color:#ff4b2b;letter-spacing:.02em;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,3px 3px 0 #3a2714;animation:zd .9s ease-out forwards}
@keyframes zd{0%{transform:translate(-50%,-100%) scale(2.2);opacity:0}15%{transform:translate(-50%,-100%) scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
@media (prefers-reduced-motion: reduce){.cut,.cheer i,.cheer b,.cheer .wa,.tlogo,.tstage img,.tcl,.shake{animation:none}}
/* title */
#title{position:fixed;inset:0;background:var(--sky);z-index:40;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow:auto}
.tcard{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{font-family:var(--font-pixel);font-size:42px;line-height:1;color:#fff;letter-spacing:.04em;text-shadow:3px 3px 0 var(--win-line)}
.logo small{display:block;font-size:24px;color:var(--btn);margin-top:6px;letter-spacing:.2em}
.tsub{color:#e6efff;font-size:14px;line-height:1.6}
#tcv{width:336px;height:112px;image-rendering:pixelated;max-width:100%}
.tform{background:var(--win);border:3px solid var(--win-line);border-radius:10px;padding:12px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:left}
.tform label{font-size:13px;color:var(--muted);font-weight:800}
.tform input{font-family:inherit;font-weight:700;font-size:16px;border:2px solid var(--win-line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--win-ink);width:100%;box-sizing:border-box}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border:3px solid var(--win-line);border-radius:8px;cursor:pointer}
.sw button.on{outline:3px solid var(--head);outline-offset:2px}
.tbtns{display:flex;flex-direction:column;gap:8px;width:100%}
.err{color:var(--bad);font-size:13px;min-height:1em}
.brk{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;margin:8px 0;font-size:12px;line-height:1.45}
.brc{display:flex;flex-direction:column;justify-content:space-around;gap:5px;min-width:0}
.brh{font-weight:800;color:var(--muted);text-align:center}
.brm{border:2px solid var(--win-dash);border-radius:6px;padding:2px 4px;background:#fff;min-width:0}
.brm.me{border-color:var(--head)}
.brm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brm .w{font-weight:800}.brm .l{opacity:.45}
.brm .sc{font-size:11px;color:var(--muted);text-align:right}
.mtac{flex:none;height:2.9em;box-sizing:border-box;background:var(--win);border:3px solid var(--win-line);border-radius:8px;padding:3px 10px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;overflow:hidden}
.mtac b{color:var(--bad)}
#match .sbw,#match .mlog,#match .mctl{flex:none}
.tacg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tacg .btn{font-size:14px;padding:6px 6px;text-align:left}
.tacg .btn small{display:block;font-size:11px;font-weight:500;line-height:1.35}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.mgrid .btn{font-size:12px;padding:5px 1px;line-height:1.25;text-align:center;white-space:nowrap;overflow:hidden}
.mgrid .btn small{display:block;font-size:11px;font-weight:700}
.pickhd{position:sticky;top:-12px;z-index:2;background:var(--win);padding:8px 0 4px;margin-top:6px;font-weight:800;font-size:14px;border-bottom:2px solid var(--win-dash)}
.pickhd b{color:var(--bad);font-size:17px}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:4px;padding:3px 2px;border-bottom:1px dashed var(--win-dash)}
.prow.picked{background:#ffe7c2;border-radius:6px}
.prow .grow{flex:1;min-width:0}
.prow .nm{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.prow .sub{font-size:11px;color:var(--muted);white-space:nowrap;line-height:1.3}
.prow .sub .fat{width:32px}
.prow .sub.st{color:var(--win-ink)}
.prow.tired{opacity:.55}
.prow .btn.sm:disabled{cursor:default}
.pickhd{display:flex;align-items:center;gap:4px}
.prow .btn.sm{padding:3px 3px;font-size:12px;display:flex;align-items:center;gap:2px;flex:none}
.prow .btn.sm .rk{font-size:11px;min-width:1.1em;padding:0 2px}
.prow .btn.sm{position:relative;padding-bottom:7px}
.xp{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:rgba(58,39,20,.18);border-radius:2px;overflow:hidden}
.xp b{display:block;height:100%;background:#2e9be0}
.xpl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:-2px 0 6px 5.4em}
.xpl .bar{flex:1;height:6px}
.xpl .bar i{background:#2e9be0}
.xnote{font-size:11px;color:var(--muted);margin:2px 0 4px}
.prow .btn.sm.on{outline:2px solid var(--win-line)}
.prow canvas.pic{width:28px;height:36px;image-rendering:pixelated;flex:none}
.bso{display:inline-flex;gap:8px;align-items:center}
.bso i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#123a20;border:1px solid #0a2414;margin-left:2px;vertical-align:-1px}
.bso .bb i.on{background:#6fe08a}.bso .ss i.on{background:#ffd23a}.bso .oo i.on{background:#ff5a4a}
/* device-style frame: status bar on top, game view, controller pad at the bottom */
body{background:#15171c}
#app{padding:0;gap:0;max-width:480px}
#screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--sky);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1c8be0;border-bottom:3px solid #0c4f8a;padding:5px max(12px,env(safe-area-inset-right,0px)) 5px max(12px,env(safe-area-inset-left,0px))}
.date{color:#fff;font-weight:800;font-size:15px;white-space:nowrap}
.date b{font-size:24px;color:#ffe14a;text-shadow:2px 0 #23314a,-2px 0 #23314a,0 2px #23314a,0 -2px #23314a,2px 2px #23314a;margin:0 2px 0 4px}
.date small{font-size:13px;margin-left:4px}
.moneybox{background:#fff;border:3px solid #0c4f8a;border-radius:10px;padding:1px 10px;font-weight:800;font-size:19px;text-align:right;color:#1b1b1b;white-space:nowrap;font-variant-numeric:tabular-nums}
.moneybox.neg{color:var(--bad)}
.moneybox small{font-size:13px;margin-left:2px}
.subtop{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0f5aa0;color:#e2eeff;font-size:13px;padding:3px max(12px,env(safe-area-inset-right,0px)) 3px max(12px,env(safe-area-inset-left,0px))}
.subtop b{color:#fff;font-size:15px}
.subtop .prog{flex:1;max-width:120px;height:6px;background:#0a3f73}
.subtop .prog i{background:#ffe14a}
#stage{padding:6px 8px}
.side{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:3px;background:#e9edf2;border:3px solid #39414d;border-radius:6px;padding:4px;z-index:5}
.si{display:flex;align-items:center;gap:8px;width:148px;background:#fff;border:2px solid #b9c2cc;border-radius:4px;padding:3px 8px 3px 3px;font-family:inherit;font-weight:800;font-size:17px;color:#222;cursor:pointer;text-align:left}
.si canvas{width:30px;height:30px;image-rendering:pixelated;background:#f6dc8e;border-radius:3px;flex:none}
.si.nav{background:#e64545;color:#fff;border-color:#a32a2a}
.si.nav::after{content:'◀';margin-left:auto;font-size:12px}
.info{display:flex;justify-content:space-between;gap:8px;background:#fff6de;border-top:3px solid #3a2714;font-size:13px;padding:4px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px));white-space:nowrap}
.info span{overflow:hidden;text-overflow:ellipsis;min-width:0}
#screen .ticker{border-radius:0;border-width:3px 0 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.nav{outline:3px solid #ff6a4d;outline-offset:1px}
.pad{flex:none;background:#24262b;border-top:4px solid #5b606a;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pl,.pr{display:flex;flex-direction:column;gap:12px;min-width:0}
.pbtn{font-family:inherit;font-weight:800;font-size:16px;color:#222;background:linear-gradient(#f6f7f9,#c6ccd3);border:2px solid #0d0e10;border-radius:7px;box-shadow:inset 0 -3px 0 #98a0aa,0 2px 0 #000;padding:10px 4px;width:100%;cursor:pointer;white-space:nowrap}
.pbtn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #98a0aa}
.pbtn.sm{font-size:13px;padding:6px 4px}
.bgmBtn.off{opacity:.6}
.dpad{position:relative;width:148px;height:148px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#f4f6f8,#b3bac3 58%,#78808a);border:3px solid #0d0e10;box-shadow:0 3px 0 #000}
.dpad::before{content:'';position:absolute;inset:10px;border-radius:50%;background:conic-gradient(from 45deg,transparent 0 2deg,#6f7781 2deg 4deg,transparent 4deg 90deg,#6f7781 90deg 92deg,transparent 92deg 180deg,#6f7781 180deg 182deg,transparent 182deg 270deg,#6f7781 270deg 272deg,transparent 272deg);opacity:.7;pointer-events:none}
.d{position:absolute;width:48px;height:48px;background:transparent;border:0;cursor:pointer;padding:0}
.d.up{left:47px;top:0}.d.down{left:47px;bottom:0}.d.left{left:0;top:47px}.d.right{right:0;top:47px}
.d::before{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:8px solid transparent;transform:translate(-50%,-50%)}
.d.up::before{border-bottom-color:#5d646e;margin-top:-4px}.d.down::before{border-top-color:#5d646e;margin-top:4px}
.d.left::before{border-right-color:#5d646e;margin-left:-4px}.d.right::before{border-left-color:#5d646e;margin-left:4px}
.d:active::before{filter:brightness(.6)}
.dc{position:absolute;left:41px;top:41px;width:60px;height:60px;border-radius:50%;border:4px solid #1f8f6e;background:radial-gradient(circle,#9aa2ab 1px,transparent 1.6px) 0 0/5px 5px,radial-gradient(circle at 50% 38%,#fbfcfd,#b7bdc5);box-shadow:0 0 0 3px #0d0e10;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;color:#33404d;padding:0;line-height:1.1}
.dc:active{filter:brightness(.92)}
.dc.ready{border-color:#ff6a4d;animation:pulse .45s ease-in-out infinite alternate}
.clock{font-family:var(--font-pixel);color:#ffcf3a;font-size:22px;text-align:right;letter-spacing:.06em;line-height:1}
.clock small{display:block;font-size:10px;color:#cfd6e0;letter-spacing:0;margin-bottom:2px}
.brand{font-size:10px;color:#6f7680;text-align:center;letter-spacing:.18em}
#match{position:absolute;inset:0;padding:6px 8px;z-index:20}
.ov{position:absolute;z-index:30}
.mcmd .opts .btn.nav{outline:3px solid #ff6a4d}

/* ---- big screens (iPad / PC): the whole app is laid out at phone size and scaled up to fill the screen ----
   portrait tablets: the phone layout, scaled to the full width
   landscape (iPad sideways, PC): the controller moves to a right-hand column and the match shows field | scoreboard side by side */
body.scaled #app{position:fixed;left:0;top:0;margin:0;max-width:none;transform-origin:0 0}
body.land #app{flex-direction:row}
body.land #screen{flex:1;min-width:0}
body.land .pad{width:236px;border-top:none;border-left:4px solid #5b606a;grid-template-columns:1fr;grid-template-rows:auto auto auto;align-content:center;justify-items:center;gap:22px;padding:16px 14px}
body.land .pl,body.land .pr{width:100%}
body.land .clock,body.land .brand{text-align:center}
body.land .mwrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 262px;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px 10px}
body.land #mstage{grid-column:1;grid-row:1/5}
body.land .sbw{grid-column:2;grid-row:1}
body.land .mlog{grid-column:2;grid-row:2;height:auto;min-height:4.65em}
body.land .mtac{grid-column:2;grid-row:3}
body.land .mctl{grid-column:2;grid-row:4}
body.land .mcmd{grid-column:2}
body.scaled .mwrap{max-width:none}
body.scaled .cfbox{transform:scale(var(--ui-scale,1))}
body.scaled .cfb{max-height:calc(62vh / var(--ui-scale,1))}
@media (prefers-reduced-motion: reduce){.fl,.banner,.dc.ready{animation:none}}
</style>

/* the standalone site is cached by the phone for a while: on the title screen, look for a newer version and offer a one-tap update */
function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)||/claude/.test(location.hostname)) return;
  const base=location.href.split('?')[0].split('#')[0];
  fetch(base+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const VER='([0-9.]+)'/); if(!m||m[1]===VER) return;
    const b=$('#tUpd'); if(!b) return; b.textContent=`新しい ver ${m[1]} があります → 更新`; b.hidden=false;
    b.onclick=()=>{try{save&&S&&save();}catch(e){} location.replace(base+'?v='+Date.now());};
  }).catch(()=>{});
}

/* ---------- pixel helpers ---------- */
function fr(g,x,y,w,h,c){g.fillStyle=c; g.fillRect(x,y,w,h);}
function diamond(g,cx,cy,r,c){g.fillStyle=c; for(let dy=-r;dy<=r;dy++){const w=r-Math.abs(dy); g.fillRect(cx-w,cy+dy,2*w+1,1);}}

function drawField(g,X,Y,w,h,hx,hy,r){
  g.save(); g.beginPath(); g.rect(X,Y,w,h); g.clip();
  for(let y=0;y<h;y+=8) fr(g,X,Y+y,w,8,(y/8)%2?'#58a744':'#62b44d');
  const cy=hy-r;
  diamond(g,hx,cy,r+8,'#c99659'); diamond(g,hx,cy,r-6,'#5fae49');
  disc(g,hx,hy,7,'#c99659'); disc(g,hx,cy,4,'#c99659'); fr(g,hx-1,cy,3,1,'#fff');
  pline(g,hx,hy,hx-260,hy-260,'#f4f4f4'); pline(g,hx,hy,hx+260,hy-260,'#f4f4f4');
  [[hx+r,cy],[hx,cy-r],[hx-r,cy]].forEach(([x,y])=>fr(g,x-1,y-1,3,3,'#fff'));
  fr(g,hx-2,hy-1,5,3,'#fff');
  const cols=['#f2c49b','#e85d5d','#ffd45c','#6fb0ff','#f4f4f4'];
  for(let x=0;x<w;x++){
    const t=(x-w/2)/(w/2), fy=Math.round(h*0.06+t*t*h*0.28);
    fr(g,X+x,Y,1,fy,'#3d3560');
    for(let yy=1;yy<fy-1;yy+=3) if(((x*7+yy*13)%5)<2) fr(g,X+x,Y+yy,1,1,cols[(x*3+yy)%5]);
    fr(g,X+x,Y+fy,1,2,'#24502a');
  }
  g.restore();
}

  akeys(p).forEach(k=>{p.cap[k]=clamp(Math.round(g+ri(-8,8)),Math.max(p[k]||0,40),99);});

/* ---------- training & economy ---------- */
function facBonus(k){if(k==='run') return 0; const n=k==='bat'?cnt('cage'):(k==='pit'||k==='chg')?cnt('pen'):cnt('knock'); return Math.min(n,3)*(k==='fld'?TUNE.knock:0.3);}
/* balance knobs: defK = how much team defense cuts the opponent's hit chance per point (batting is worth about 0.0055), oppG = yearly growth of opponents, expK = exp per point */
const TUNE={defK:0.008,oppG:2,expK:1.7,knock:1.0,rhy:0.004,e0:6,e2:0.085,spill:0.3,
  /* SS balance: パワー型 = 3 in 10 at-bats a home run, ミート型 = hits .500, SS走 = steals every chance and never fails */
  ssPowHR:0.3,ssPowH:0.45,ssMeetH:0.2,ssRunA:0.75,ssRun3:0.6,ssRunIH:0.8,ssPit:0.65,ssChg:0.38,ssFldTeam:12};
/* exp per point grows with the square of the value: F/E/D come quickly (a natural tutorial), B/A/S stay heavy */
function needExp(p,k){const v=p[k]; return (TUNE.e0+v*v*TUNE.e2)*TUNE.expK;}
/* progress toward the next rank (F→E at 40, then every 10 points, S tops out at 99) */
function nextRankAt(v){return v<40?40:v>=90?99:Math.floor(v/10)*10+10;}
function rankProg(p,k){const v=p[k]; if(v>=99) return 1; const hi=nextRankAt(v), lo=hi===40?30:hi===99?90:hi-10; return clamp((v-lo+(p.exp[k]||0)/needExp(p,k))/(hi-lo),0,1);}
function addExp(p,k,amt,silent){
  if(p[k]==null||p[k]>=99) return; ensureCap(p); const capK=Math.min(99,p.cap[k]||99); if(p[k]>=capK) return; /* reached the ceiling: no more growth */
  p.exp[k]=(p.exp[k]||0)+amt; let ups=0; const r0=rank(p[k]);
  while(p.exp[k]>=needExp(p,k)&&p[k]<capK){p.exp[k]-=needExp(p,k); p[k]++; ups++;}
  if(ups&&p.car&&canSS(p)&&!p.ssTold){p.ssTold=1; news(`${p.name}がSS覚醒できるようになった！ 選手一覧から選ぼう`);}
  if(ups){sync(p); p.sal=salary(p); const h=HS.get(p.id); if(h&&!silent){const r1=rank(p[k]); hfloat(h.x,h.y-17,r1!==r0?`${ABIL[k]} ${r1}にUP！`:`${ABS[k]}↑`,r1!==r0?'up big':'up'); if(r1!==r0) news(`${p.name}の${ABIL[k]}が ${r1} ランクに上がった！`);}}
}
function pickOf(p){return (S.cmd.picks||[]).find(x=>x.id===p.id);}
/* everyone practices: the 3 picked players are the focus (強化選手) and get a multiple of what the rest of the squad gets.
   the rest get the "regular practice" amount split over their two main abilities (自主練 gives them half) */
const PICK_MUL={self:1,normal:2.5,camp:6}, REST_MUL={self:0.5,normal:1,camp:1};
function trainDay(){
  const M=MENU[S.cmd.menu], k=S.cmd.menu;
  S.players.forEach(p=>{
    if(!M.base){p.fat=clamp(p.fat+M.fat-cnt('dorm')*2,0,100); return;}
    const pk=pickOf(p);
    const unit=3*2.3*LV[S.lvl].exp*p.tal*[0.7,0.85,1,1.15,1.3][p.cond-1]*(p.age>=32?0.7:1);
    if(pk){
      p.fat=clamp(p.fat+M.fat-Math.min(2,cnt('dorm'))*2.5,0,100);
      const g=unit*PICK_MUL[k]*(1-p.fat/160)*(1+facBonus(pk.ab))*rnd(0.8,1.2);
      addExp(p,pk.ab,g);
      /* hidden: drilling defense lifts the whole player (footwork → running, eye → batting/pitching), so a defense-first team keeps getting stronger everywhere */
      if(pk.ab==='fld') akeys(p).forEach(a=>{if(a!=='fld') addExp(p,a,g*TUNE.spill,true);});
    } else {
      p.fat=clamp(p.fat-2-cnt('dorm')*1.5,0,100);
      const w=SPREADW(p);
      for(const a in w) addExp(p,a,unit*REST_MUL[k]*w[a]*(1-p.fat/160)*(1+facBonus(a))*rnd(0.8,1.2),true);
    }
  });
}
/* money (hidden from the player on purpose): signs pay a flat 5万/day; on game day, tickets 1500円 x crowd, each stall up to 100万 (full at 1000 crowd), each goods shop 1000円 x fans plus 1000円 x crowd. All game-day income scales with tournament level */
function economy(){
  S.money+=cnt('board')*5;
  spawnVisitors(Math.min(8,Math.ceil((20+S.pop*0.05)/14)));
}
function gameIncome(){
  const inc=LV[S.lvl].inc, cap=1000+cnt('stand')*2000;
  const att=Math.round(Math.min(cap,50+S.pop*0.8*rnd(0.85,1.1)));
  const ticket=att*0.15*Math.sqrt(inc);
  /* stalls and goods grow with the square root of the level, and extra goods shops share the same fans (each shop adds half as much as the one before), so money can't snowball */
  const si=Math.sqrt(inc);
  const stall=cnt('stall')*100*si*Math.min(1,att/1000);
  const goods=cnt('goods')*(S.pop*0.01+att*0.05)*si;
  return {att,total:Math.round(ticket+stall+goods)};
}
const EVENTS=[
  ()=>{const f=30*(S.lvl+1); S.pop+=f; return `地元テレビで特集された！ ファン+${f}人`;},
  ()=>{const m=Math.round((30+S.pop*0.02)*LV[S.lvl].inc); S.money+=m; return `スポンサーから応援金 ${m}万円！`;},
  ()=>{const p=pick(S.players); const k=pick(akeys(p)); if(p[k]>=99) return null; const b=p[k]; p[k]=Math.min(99,p[k]+3); sync(p); return p[k]>b?`${p.name}が練習中にコツをつかんだ！ ${ABIL[k]}+${p[k]-b}`:null;},
  ()=>{S.players.forEach(p=>p.fat=Math.max(0,p.fat-20)); return 'ファンから差し入れ！ みんなの疲れが少し取れた';},
  ()=>{S.pop+=10; return '子どもたちが練習を見学に来た。ファン+10人';}];
function tick(){
  if(S.day>=TOTAL_YEARS*YEAR_DAYS){ending(); return;}
  const wd=S.day%7;
  const cup=isCupMonth(S.day);
  if(!cup&&wd===0&&doyOf(S.day)%28<7&&S.cmdMonth!==monthIdx(S.day)){commandPrompt(); return;}
  if(cup&&wd===5&&S.lastPlayed!==S.day&&S.cupDoneM!==monthIdx(S.day)){matchPrompt(); return;}
  if(wd<5){ if(cup) S.players.forEach(p=>p.fat=clamp(p.fat-3-cnt('dorm')*2,0,100)); else trainDay(); }
  economy();
  S.day++;
  S.maxMoney=Math.max(S.maxMoney,S.money);
  if(S.day%7===0) weekly();
  if(doyOf(S.day)%28===0) monthly();
  if(doyOf(S.day)===0&&S.day<TOTAL_YEARS*YEAR_DAYS) newYear();
  save(); renderHUD();
}
function weekly(){
  S.pop+=Math.round(teamStr(S.players)*0.1*(1+S.lvl*0.3));
  S.players.forEach(p=>{p.cond=clamp(p.cond+ri(-1,1)+(p.cond>3&&Math.random()<0.3?-1:0)+(p.cond<3&&Math.random()<0.3?1:0),1,5);});
  const avg=S.players.reduce((s,p)=>s+p.fat,0)/S.players.length;
  if(avg>60) news('選手たちがかなり疲れています。次の練習の月は「休養」がおすすめ');
  else if(Math.random()<0.4){const t=pick(EVENTS)(); if(t) news(t);}
}
function monthly(){
  const tot=S.players.reduce((s,p)=>s+p.sal,0); S.money-=tot;
  S.scouts=genScouts();
  checkAch();
  news(`月末です。給料 ${tot}万円を払いました。スカウトに新しい候補が来ています`);
}
const AGE={decline:31,fast:34,retire:36,last:39};
/* age tag shown next to the position, so retirement never comes as a surprise */
function ageTag(p){const a=p.age||25;
  if(a>=AGE.last-1) return `<b style="color:#c8402f">${a}歳・今年で引退</b>`;
  if(a>=AGE.retire) return `<b style="color:#c8402f">${a}歳・引退が近い</b>`;
  if(a>=AGE.retire-1) return `<b style="color:#e0a020">${a}歳・来年から引退あり</b>`;
  if(a>=AGE.fast) return `<span style="color:#e0a020">${a}歳・衰えが速い</span>`;
  if(a>=AGE.decline) return `<span class="note">${a}歳・衰え中</span>`;
  return `<span class="note">${a}歳</span>`;}
function ssLabel(p){return 'SS'+SST[ssType(p)].n;}
function newYear(){
  Object.values(S.cups||{}).forEach(ts=>ts.forEach(t=>t.roster.forEach(p=>{sync(p); ALLK.forEach(k=>{if(p.ss!==k&&p[k]!=null) p[k]=Math.min(99,p[k]+ri(0,TUNE.oppG));}); sync(p);})));
  const yr=yearOf(S.day)-1; S.recs=S.recs||{};
  S.players.forEach(p=>{
    const st=p.st; p.hist.push({y:yr,...st});
    if(st.hr>(S.recs.hr?S.recs.hr.v:0)) S.recs.hr={v:st.hr,name:p.name,y:yr};
    if(st.ab>=60){const a=st.h/st.ab; if(a>(S.recs.avg?S.recs.avg.v:0)) S.recs.avg={v:a,name:p.name,y:yr};}
    if(st.rbi>(S.recs.rbi?S.recs.rbi.v:0)) S.recs.rbi={v:st.rbi,name:p.name,y:yr};
    if(st.w>(S.recs.w?S.recs.w.v:0)) S.recs.w={v:st.w,name:p.name,y:yr};
    p.age++; p.st={ab:0,h:0,hr:0,rbi:0,w:0,l:0,g:0};
    if(p.age>=AGE.decline){const d=p.age>=AGE.fast?[3,7]:p.age>=AGE.decline+2?[2,5]:[1,3]; ensureCap(p);
      ALLK.forEach(k=>{if(p.ss!==k&&p[k]!=null) p[k]=Math.max(5,p[k]-ri(d[0],d[1]));}); Object.keys(p.cap).forEach(k=>{p.cap[k]=Math.max(30,p.cap[k]-ri(d[0],d[1]));}); sync(p);}
    p.sal=salary(p);});
  /* retirement: from 36, certain at 39. the great ones go into the hall of fame */
  const gone=S.players.filter(p=>p.age>=AGE.retire&&(p.age>=AGE.last||Math.random()<(p.age-AGE.retire+1)*0.3));
  if(gone.length){S.hall=S.hall||[]; S.players=S.players.filter(p=>!gone.includes(p));
    gone.forEach(p=>{if(p.ss||ovr(p)>=85||(p.car&&(p.car.hr>=60||p.car.w>=40))) S.hall.push({name:p.name,pos:p.pos,ss:p.ss||null,ssk:p.ss?ssLabel(p):'',hr:p.car?p.car.hr:0,h:p.car?p.car.h:0,ab:p.car?p.car.ab:0,w:p.car?p.car.w:0,y:yearOf(S.day)-1,age:p.age});});
    news(`${gone.map(p=>p.name).join('・')}が引退しました。おつかれさま！`);
    setTimeout(()=>popup('引退',`<p>${gone.map(p=>`<b>${esc(p.name)}</b>（${POSN[p.pos]}・${p.age}歳）`).join('<br>')}</p><p>長い間おつかれさまでした！</p>${gone.some(p=>S.hall.some(h=>h.name===p.name&&h.y===yearOf(S.day)-1))?'<p class="good">名選手は「記録」の殿堂に残ります。</p>':''}<p class="note">スカウトで新しい選手を探そう。</p>`,[{label:'OK'}]),300);}
  const got=tryUnlock(); if(got.length) news(`新しい大会「${LV[S.unlocked].name}」に挑戦できるようになりました！`);
  const old=S.players.filter(p=>p.age>=AGE.retire); if(old.length&&!gone.length) setTimeout(()=>{if(ov.hidden) popup('ベテランの選手',`<p>${old.map(p=>`<b>${esc(p.name)}</b>（${p.age}歳）`).join('・')}は、年末に引退するかもしれません${old.some(p=>p.age>=AGE.last-1)?'（'+old.filter(p=>p.age>=AGE.last-1).map(p=>esc(p.name)).join('・')+'は今年で必ず引退）':''}。</p><p class="note">${AGE.retire}歳から引退の可能性があり、${AGE.last}歳で必ず引退します。後継ぎをスカウトしておこう。</p>`,[{label:'OK'}]);},400);
  checkAch();
  news(`${yearOf(S.day)}年目が始まりました！ 残り${TOTAL_YEARS-yearOf(S.day)+1}年`);
}

/* ---------- modal ---------- */
const ov=$('#ov');
function modal(title,body,buttons){
  $('#ovT').textContent=title; $('#ovB').innerHTML=body; const f=$('#ovF'); f.innerHTML='';
  (buttons||[{label:'閉じる',sub:true}]).forEach(b=>{const el=document.createElement('button'); el.className='btn'+(b.sub?' sub':''); el.textContent=b.label; el.onclick=()=>{ if(b.fn){ if(b.fn(el)===false) return; } else closeModal(); }; f.appendChild(el);});
  const fresh=ov.hidden; ov.hidden=false; $('#ovB').scrollTop=0;
  if(fresh) navI=-1; applyNav();
  return $('#ovB');
}
function closeModal(){ov.hidden=true; navI=$('#side').hidden?-1:0; applyNav();}
function picsIn(root,list,pal){root.querySelectorAll('canvas[data-pid]').forEach(c=>{const p=list.find(x=>x.id==c.dataset.pid); if(p) drawPortrait(c,p,pal||myPal(),p.pos);});}

/* ---------- pop-up confirm (drawn above any open window) ---------- */
function popup(title,html,btns){
  let el=$('#cfm'); if(!el){el=document.createElement('div'); el.id='cfm'; document.body.appendChild(el);}
  el.innerHTML=`<div class="cfbox" role="dialog" aria-modal="true"><div class="cft">${title}</div><div class="cfb">${html}</div><div class="cff"></div></div>`;
  const f=el.querySelector('.cff'); btns.forEach(b=>{const x=document.createElement('button'); x.className='btn'+(b.sub?' sub':''); x.textContent=b.label; x.onclick=()=>{el.hidden=true; if(b.fn) b.fn();}; f.appendChild(x);});
  el.hidden=false; return el;
}
function confirmPop(title,html,okLabel,onOK){return popup(title,html,[{label:'やめる',sub:true},{label:okLabel||'決定',fn:onOK}]);}
function ssChoose(p,done){
  const el=popup(`${esc(p.name)}をSS覚醒`,`<p>どの型のSSにしますか？</p><p class="note">1人1つだけ。あとから選び直しはできません。</p><div class="sslist">${ssTypes(p).map(t=>`<button class="btn sub" data-k="${t}" style="text-align:left;font-size:15px">SS${SST[t].n}<small style="display:block;font-weight:500">${SST[t].fx}</small></button>`).join('')}</div>`,[{label:'やめる',sub:true}]);
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>ssConfirm(p,b.dataset.k,done));
}
function ssConfirm(p,k,done){
  confirmPop('SS覚醒の確認',`<p><b>${esc(p.name)}</b>を<b>SS${SST[k].n}</b>に覚醒させますか？</p><p style="color:#8a2be2;font-weight:800">${SST[k].fx}</p><p class="bad">一度決めると選び直しはできません。</p>`,'覚醒させる',()=>{
    awakenType(p,k); news(`${p.name}がSS${SST[k].n}に覚醒！ ${ssfx(p)}`); save(); renderHUD(); if(done) done();});
}

/* ---------- weekly command ---------- */
let paused=false;
const canPay=c=>c<=0||S.money>=c; /* free options must always work, even in the red */
function menuCost(k){return Math.round(MENU[k].cost*4*LV[S.lvl].cost);} /* one command now covers a whole month (4 weeks) */
function statLine(p){const t=p.st||{};
  if(p.pos==='投'){const era=t.po?(t.er*27/t.po).toFixed(2):'-.--'; return `防御率 <b>${era}</b>　球速 <b>${p.velo}</b>km`;}
  const avg=t.ab?(t.h/t.ab).toFixed(3).replace(/^0/,''):'.---'; return `打率 <b>${avg}</b>　HR <b>${t.hr||0}</b>`;}
function commandPrompt(){
  paused=true;
  const TIRED=90, tired=p=>p.fat>=TIRED;
  const maxed=(p,k)=>p[k]>=90; /* S (or SS) abilities can't be picked for focus training any more */
  const sel={menu:S.cmd.menu,picks:(S.cmd.picks||[]).filter(x=>S.players.some(p=>p.id===x.id&&!tired(p)&&akeys(p).includes(x.ab)&&!maxed(p,x.ab))).slice(0,3)};
  if(!canPay(menuCost(sel.menu))) sel.menu='self';
  let msg='';
  /* players who can still be picked: not exhausted and with at least one ability below S */
  const need=Math.min(3,S.players.filter(p=>!tired(p)&&akeys(p).some(k=>!maxed(p,k))).length);
  const draw=()=>{
    const trains=MENU[sel.menu].base>0;
    const list=S.players.slice().sort((a,b)=>(a.pos==='投')-(b.pos==='投')||POS.indexOf(a.pos)-POS.indexOf(b.pos));
    const rows=list.map(p=>{const pk=sel.picks.find(x=>x.id===p.id), tr=tired(p); return `<div class="prow${pk?' picked':''}${tr?' tired':''}"><canvas class="pic" data-pid="${p.id}"></canvas><div class="grow"><div class="nm">${esc(p.name)} ${rk(ovr(p))}${p.ss?`<span class="rk" style="background:#8a2be2;margin-left:2px">SS${ssShort(p)}</span>`:ssBadge(p)}${p.legacy?' <span class="rk" style="background:#e0457b">引継</span>':''}</div><div class="sub">${POS_S[p.pos]}　疲れ${fatHTML(p)}${tr?' <b class="bad">疲れすぎ</b>':''}　${ageTag(p)}</div><div class="sub st">${statLine(p)}${canSS(p)?`<button class="btn sm ssb" data-ssp="${p.id}">SS覚醒できる！</button>`:''}</div></div>`+akeys(p).map(k=>`<button class="btn sm ${pk&&pk.ab===k?'on':'sub'}"${tr||maxed(p,k)?' disabled':''} data-p="${p.id}" data-ab="${k}" title="${maxed(p,k)?'Sランクなのでこれ以上は強化できません':`次のランクまで ${Math.round(rankProg(p,k)*100)}%`}">${ABS[k]}<span class="rk" style="background:${RKC[rank(p[k])]}">${rank(p[k])}</span><i class="xp"><b style="width:${Math.round(rankProg(p,k)*100)}%"></b></i></button>`).join('')+`</div>`;}).join('');
    const b=modal(`${dateStr(S.day).replace(/ 月曜$/,'')}　今月のコマンド`,
      `<div class="mgrid">`+Object.entries(MENU).map(([k,v])=>{const c=menuCost(k); const lack=!canPay(c); return `<button class="btn ${sel.menu===k?'on':'sub'}${lack?' off':''}" data-m="${k}">${v.name}<small>${c?`${c}万円`:'無料'}</small></button>`;}).join('')+`</div>`+
      `<p class="note" style="margin:4px 0 0">${MENU[sel.menu].desc}${sel.menu==='sales'?`（約${salesGain()}万円）`:''}${!canPay(menuCost(sel.menu))?'　<span class="bad">お金が足りません</span>':''}</p>`+(S.money<0?`<p class="bad" style="margin:2px 0">赤字です。無料の「自主練」「休養」、お金がもらえる「営業回り」で立て直そう</p>`:'')+
      (trains?`<div class="pickhd">強化選手を${need}人選ぶ <b>${sel.picks.length}/${need}</b><button class="btn sm sub" id="pReset" style="margin-left:auto;font-size:13px;padding:3px 10px"${sel.picks.length?'':' disabled'}>リセット</button></div>${need<3?`<p class="note" style="margin:2px 0;color:#8a2be2;font-weight:800">${need?`強化できる選手が${need}人だけなので、${need}人選べば決定できます`:'強化できる選手がいません（全員Sランク以上か疲れすぎ）。このまま決定できます'}</p>`:''}<div class="xnote">野手は打・守・走、投手は投・変・守のどれかをタップ（Sになった能力は選べません）。ほかの選手もふつうに練習して少しずつ伸びます（疲れ90%以上は選べません）</div><div class="xnote">ボタンの下の青いバー＝次のランクまでの経験値</div>${msg?`<p class="bad" style="margin:2px 0">${msg}</p>`:''}<div class="plist">${rows}</div>`:'<p class="note">今月は練習しないので、全員が休んで疲れを取ります。</p>'),
      [{label:trains&&sel.picks.length<need?`あと${need-sel.picks.length}人選んでください`:`これで決定${menuCost(sel.menu)?`（-${menuCost(sel.menu)}万円）`:''}`,fn:()=>{
        const c=menuCost(sel.menu); if(!canPay(c)) return false;
        if(MENU[sel.menu].base>0&&sel.picks.length<need){msg=`強化選手を${need}人選んでください`; draw(); return false;}
        S.money-=c; S.cmd={menu:sel.menu,picks:sel.picks.slice()}; S.cmdWeek=weekIdx(S.day); S.cmdMonth=monthIdx(S.day); HS.clear();
        if(sel.menu==='sales'){const g=salesGain(); S.money+=g; S.pop+=40; news(`営業回りでスポンサー料 ${g}万円をもらいました！`);}
        else if(MENU[sel.menu].base>0) news(`今月は${MENU[sel.menu].name}：`+sel.picks.map(x=>{const p=S.players.find(y=>y.id===x.id); return `${p.name}（${ABS[x.ab]}）`;}).join('・'));
        else news(`今月は「${MENU[sel.menu].name}」でいきます`);
        closeModal(); paused=false; save(); renderHUD(); return false;}}]);
    picsIn(b,list);
    b.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{if(!canPay(menuCost(el.dataset.m)))return; sel.menu=el.dataset.m; msg=''; draw();});
    const rs=b.querySelector('#pReset'); if(rs) rs.onclick=()=>{sel.picks=[]; msg=''; draw();};
    b.querySelectorAll('[data-ssp]').forEach(el=>el.onclick=()=>{const p=S.players.find(x=>x.id===+el.dataset.ssp); const sc=$('#ovB').scrollTop; ssChoose(p,()=>{sel.picks=sel.picks.filter(x=>!(x.id===p.id&&maxed(p,x.ab))); draw(); $('#ovB').scrollTop=sc;});});
    b.querySelectorAll('[data-ab]').forEach(el=>el.onclick=()=>{
      const id=+el.dataset.p, ab=el.dataset.ab; const cur=sel.picks.find(x=>x.id===id);
      {const pp=S.players.find(p=>p.id===id); if(tired(pp)||maxed(pp,ab)) return;}
      if(cur&&cur.ab===ab) sel.picks=sel.picks.filter(x=>x!==cur);

function genScouts(withSS){

function matchUpdate(dt){

  } else if(M.pauseT>0){M.pauseT-=ms;}

function drawMatch(){
  const g=mctx; g.drawImage(mbg,0,0);
  const G=M.G, ev=M.phase==='ev'?M.ev:null;
  const def=ev?ev.def:defL(), off=ev?ev.off:offL();
  const ents=[]; const t=M.t; const FT=ev&&ev.ft||500, LT=300+FT; /* LT = when the ball lands */
  for(const [pos,pl] of Object.entries(def.fieldOf)){
    let [x,y]=FP[pos];
    if(ev&&ev.tgt&&ev.fielder===pos&&t>300){
      const reach=['GO','FO','SAC'].includes(ev.res)?1:0.55;
      const k=t<LT?(t-300)/FT*reach:Math.max(0,reach*(1-(t-LT)/600));
      x+=(ev.tgt[0]-x)*k; y+=(ev.tgt[1]-y)*k;
    }
    ents.push({y,f:()=>drawGuy(g,pl,def.pal,x,y,(ev&&ev.fielder===pos&&t>300&&t<LT+600)?Math.floor(t/120)%2:0,null,pos)});
  }
  let pY=FP.投[1]; if(M.phase==='pitch'&&M.pt<M.wind) pY-=Math.sin(M.pt/M.wind*Math.PI)*2;
  let px0=FP.投[0];
  if(ev&&ev.fielder==='投'&&ev.tgt&&t>300){const k=t<LT?(t-300)/FT:Math.max(0,1-(t-LT)/600); px0+=(ev.tgt[0]-px0)*k; pY+=(ev.tgt[1]-pY)*k;}
  ents.push({y:pY,f:()=>drawGuy(g,def.pitcher,def.pal,px0,pY,0,null,'投')});
  const curB=L=>G.pa&&L===offL()?G.pa.b:nextBatter(L);
  if(M.phase==='pitch'||M.phase==='choose'){const b=curB(off); const sw=M.phase==='pitch'&&M.tap!==null&&M.pt>=M.wind+M.T-70?'swing':'ready'; ents.push({y:178,f:()=>drawGuy(g,b,off.pal,76,178,0,sw)});}
  else if(ev&&!ev.steal&&(ev.pitchOnly||!M.assigned)) ents.push({y:178,f:()=>drawGuy(g,ev.b,off.pal,76,178,0,(ev.swung&&t>260)?'swing':'ready')});
  else if(!G.over){const L=ev?ev.off:offL(); ents.push({y:178,f:()=>drawGuy(g,curB(L),L.pal,76,178,0,'ready')});}
  for(const r of M.RD) ents.push({y:r.y,f:()=>drawGuy(g,r.p,r.pal,r.x,r.y,r.wp.length?Math.floor(r.walk*8)%2:0)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  let bx=null,by=0,bh=0;
  if(M.phase==='pitch'){
    const arrive=M.wind+M.T;
    if(M.pt>=M.wind){const k=Math.min(1,(M.pt-M.wind)/M.T); bx=88+(M.brk?Math.sin(k*Math.PI)*5:0); by=140+k*34; bh=3*(1-k)+1;}
    else {bx=FP.投[0]+3; by=pY-6; bh=0;}
  } else if(ev&&!ev.steal){
    if(t<300){const k=t/300; bx=88; by=140+k*34; bh=3;}
    else if(ev.tgt&&t<LT){const k=(t-300)/FT; bx=88+(ev.tgt[0]-88)*k; by=174+(ev.tgt[1]-174)*k; bh=ev.arc*4*k*(1-k)+1;}

  if(bx!==null){const r=2.4+Math.min(2.2,bh/9); disc(g,bx,by+1,r*0.8,'rgba(20,40,20,.4)'); disc(g,bx,by-bh,r+1,'#2a2a2a'); disc(g,bx,by-bh,r,'#ffffff'); disc(g,bx-r*0.3,by-bh-r*0.3,r*0.35,'#ffffff');}

function drawZone(g,pl,k,wind){

  fr(g,cx-6,Y+H-5,13,2,'#f4f4f4');

function fit(wrap,stage,lw,lh){const W=stage.clientWidth,H=stage.clientHeight; if(!W||!H)return; const s=Math.min(W/lw,(H-6)/lh); wrap.style.width=Math.floor(lw*s)+'px'; wrap.style.height=Math.floor(lh*s)+'px';}

/* scale the phone-sized layout up to iPads and PCs (phones stay untouched) */
function layoutApp(){
  const W=window.innerWidth, H=window.innerHeight, app=$('#app'), B=document.body;
  const land=W>H*1.05&&H>=560, big=!land&&W>=560;
  B.classList.toggle('land',land); B.classList.toggle('scaled',land||big);
  let s=1;
  if(land){s=H/700; app.style.width=(W/s)+'px'; app.style.height='700px'; app.style.left='0px';}
  else if(big){s=Math.min(W/480,H/820); const dw=Math.min(W/s,620), dh=H/s; /* keep a phone-like height so the match field is not squeezed by the controller */ app.style.width=dw+'px'; app.style.height=dh+'px'; app.style.left=((W-dw*s)/2)+'px';}
  else {app.style.width=''; app.style.height=''; app.style.left=''; app.style.transform='';}
  if(land||big) app.style.transform=`scale(${s})`;
  document.documentElement.style.setProperty('--ui-scale',s);
  /* title card */
  const tc=document.querySelector('#title .tcard');
  if(tc){ if(land||big){const st=Math.min(W/440,H/780,2.2); tc.style.transform=`scale(${st})`; tc.style.transformOrigin='50% 0'; const h=tc.offsetHeight; tc.style.margin=`${Math.max(0,(H-32-h*st)/2)}px auto ${Math.max(0,(st-1)*h)}px`;}
    else {tc.style.transform=''; tc.style.margin='';} }
  fitAll();
}

let fitN=0;

/* ---------- BGM: original chiptune songs played by the browser itself (no sound files) ----------
   each song: bpm and channels written as "note:length" (length in 16th notes, default 2), r = rest; drums k/s/h.
   channels loop on their own length; jingles play once and then hand over to the next song */
const BGM_KEY='masaki-ballpark-bgm';
const SONGS={
  title:{bpm:144,lead:'C5 E5 G5 C6 B5 G5 E5:4 F5 A5 C6 A5 G5:6 r E5 G5 C6:3 B5:1 A5 G5 F5 E5 D5 E5 F5 D5 G5:8 C5 E5 G5 C6 D6 C6 A5:4 F5 A5 C6 F6 E6:4 D6:4 C6 G5 E5 G5 F5 D5 B4:4 C5:4 G4 C5 C5:6 r',
    bass:'C3:4 G3:4 C4:4 G3:4 F2:4 C3:4 F3:4 C3:4 A2:4 E3:4 A3:4 E3:4 G2:4 D3:4 G3:4 D3:4 C3:4 G3:4 C4:4 G3:4 F2:4 C3:4 F3:4 C3:4 C3:4 G3:4 G2:4 D3:4 C3:4 G3:4 C4:4 C3:4',
    drum:'k h s h k h s h'},
  home:{bpm:104,soft:true,lead:'A4:4 C5 A4 G4:4 F4:4 G4:4 A4 G4 C4:8 A4:4 C5 D5 C5:4 A4:4 G4 A4 G4 E4 F4:8 D5:4 C5 A4 A#4:4 A4:4 G4:4 A4 A#4 C5:8 D5 C5 A#4 A4 G4:4 C5:4 F4:12 r:4',
    bass:'F2:6 C3:2 F3:4 C3:4 C3:6 G3:2 C4:4 G3:4 F2:6 C3:2 F3:4 C3:4 C3:6 G3:2 C4:4 G3:4 A#2:6 F3:2 A#3:4 F3:4 C3:6 G3:2 C4:4 G3:4 G2:4 D3:4 C3:4 G3:4 F2:8 F3:8',
    drum:'k:4 h:4 h:4 h:4'},
  match:{bpm:160,lead:'G4 G4 B4 D5 r D5 E5 D5 B4 G4 A4 B4 A4:8 G4 G4 B4 D5 r G5 F#5 E5 D5 B4 C5 A4 G4:8 C5 C5 E5 G5 F#5:4 E5:4 D5 D5 B4 G4 A4:8 E5 E5 D5 C5 B4 C5 D5:4 G5 r G5 r G5:4 r:4',
    bass:'G2 G3 G2 G3 G2 G3 G2 G3 D2 D3 D2 D3 D2 D3 D2 D3 E2 E3 E2 E3 E2 E3 E2 E3 D2 D3 D2 D3 G2 G3 G2 G3 C3 C4 C3 C4 C3 C4 C3 C4 G2 G3 G2 G3 D2 D3 D2 D3 C3 C4 C3 C4 D3 D4 D3 D4 G2 G3 G2 G3 G2 G3 G2 G3',
    drum:'k h s h k k s h'},
  win:{bpm:150,once:true,lead:'C5 E5 G5 C6:6 A5 B5 C6:8',bass:'C3 G3 C4 E3:6 F3 G3 C3:8'},
  lose:{bpm:110,once:true,soft:true,lead:'E5:4 D5:4 C5:4 B4 A4 G#4:12',bass:'A2:4 G2:4 F2:4 E2:4 E2:12'},
  hr:{bpm:180,once:true,lead:'G4:1 C5:1 E5:1 G5:1 C6:4 G5 C6:8',bass:'C3:4 C3:4 G2 C3:8',drum:'s:1 s:1 s:1 s:1 k:4 s k:8'},
  champ:{bpm:132,once:true,lead:'G4 C5 E5 G5:4 E5 G5 A5 G5:4 F5 E5 D5 C5 D5 E5 G5 C6:12',bass:'C3:8 E3:8 F3:8 G3:8 G2 C3:12',drum:'k:4 s:4 k:4 s:4 k:4 s:4 k:4 s:4 s s k:12'}
};
const NOTE_I={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function parseTrack(str){return str.trim().split(/\s+/).map(t=>{const [n,l]=t.split(':'); const len=+(l||2); if(n==='r') return {f:0,len}; if(/^[ksh]$/.test(n)) return {d:n,len}; const m=/^([A-G]#?)(\d)$/.exec(n); return {f:440*Math.pow(2,(NOTE_I[m[1]]+12*(+m[2]+1)-69)/12),len};});}
Object.values(SONGS).forEach(s=>['lead','bass','drum'].forEach(k=>{if(s[k]) s[k]=parseTrack(s[k]);}));
const BGM={ctx:null,on:true,cur:null,next:null,timer:null,ch:[],start:0,vol:null,noise:null};
try{BGM.on=localStorage.getItem(BGM_KEY)!=='0';}catch(e){}
function bgmCtx(){
  if(BGM.ctx) return BGM.ctx; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  const c=new AC(); BGM.ctx=c;
  const nb=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; BGM.noise=nb;
  return c;
}
function bgmNote(kind,ev,t,dur,soft){
  const c=BGM.ctx; if(!BGM.vol) return; const g=c.createGain(); g.connect(BGM.vol);
  if(ev.d){ const src=c.createBufferSource(); src.buffer=BGM.noise; const f=c.createBiquadFilter();
    const v=(soft?0.5:1)*(ev.d==='k'?0.9:ev.d==='s'?0.55:0.18), len=ev.d==='k'?0.09:ev.d==='s'?0.12:0.04;
    f.type=ev.d==='k'?'lowpass':ev.d==='s'?'bandpass':'highpass'; f.frequency.value=ev.d==='k'?160:ev.d==='s'?1800:7000;
    src.connect(f); f.connect(g); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+len); src.start(t); src.stop(t+len+0.02); return; }
  if(!ev.f) return;
  const o=c.createOscillator(); o.type=kind==='lead'?'square':'triangle'; o.frequency.value=ev.f; o.connect(g);
  const v=kind==='lead'?(soft?0.22:0.3):0.55, end=t+Math.max(0.05,dur*0.9);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.setValueAtTime(v*0.75,t+Math.min(0.08,dur*0.4)); g.gain.linearRampToValueAtTime(0.0001,end);
  o.start(t); o.stop(end+0.02);
}
function bgmTick(){
  const c=BGM.ctx, s=SONGS[BGM.cur]; if(!c||!s) return; const step=60/s.bpm/4, ahead=c.currentTime+0.25; let allDone=true;
  BGM.ch.forEach(ch=>{
    while(!ch.done&&ch.t<ahead){ const ev=ch.tr[ch.i]; bgmNote(ch.k,ev,ch.t,ev.len*step,s.soft); ch.t+=ev.len*step; ch.i++;
      if(ch.i>=ch.tr.length){ if(s.once) ch.done=true; else ch.i=0; } }
    if(!ch.done||ch.t>c.currentTime) allDone=false;
  });
  if(s.once&&allDone){const n=BGM.next; BGM.next=null; BGM.cur=null; if(n) bgmPlay(n);}
}
/* play a song (a jingle first plays once, then `after`) */
function bgmPlay(name,after){
  if(SONGS[name]&&SONGS[name].once){ BGM.next=after||(BGM.cur&&!SONGS[BGM.cur].once?BGM.cur:BGM.next); }
  else if(BGM.cur&&SONGS[BGM.cur].once){ BGM.next=name; return; } /* let the jingle finish */
  else if(BGM.cur===name) return;
  BGM.want=name; if(!BGM.on) {BGM.cur=SONGS[name].once?null:name; return;}
  const c=bgmCtx(); if(!c) return; if(c.state==='suspended') c.resume().catch(()=>{});
  bgmFresh(c);
  BGM.cur=name; const s=SONGS[name], t0=c.currentTime+0.06;
  BGM.ch=['lead','bass','drum'].filter(k=>s[k]).map(k=>({k,tr:s[k],i:0,t:t0,done:false}));
  if(!BGM.timer) BGM.timer=setInterval(bgmTick,40); bgmTick();
}
/* each song gets its own volume knob, so notes already queued by the previous song fade out instead of overlapping */
function bgmFade(){const o=BGM.vol, c=BGM.ctx; if(!o||!c) return; const t=c.currentTime; o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value,t); o.gain.linearRampToValueAtTime(0,t+0.08); setTimeout(()=>{try{o.disconnect();}catch(e){}},400); BGM.vol=null;}
function bgmFresh(c){bgmFade(); BGM.vol=c.createGain(); BGM.vol.gain.value=0.16; BGM.vol.connect(c.destination);}
function bgmStop(){BGM.cur=null; BGM.ch=[]; bgmFade();}
function bgmScene(){return !started?'title':M?'match':'home';}
function bgmSet(on){
  BGM.on=on; try{localStorage.setItem(BGM_KEY,on?'1':'0');}catch(e){}
  if(on){BGM.cur=null; BGM.next=null; bgmPlay(bgmScene());} else {const n=BGM.cur&&SONGS[BGM.cur].once?BGM.next:BGM.cur; bgmStop(); BGM.cur=null; BGM.want=n;}
  bgmLabel();
}
function bgmLabel(){document.querySelectorAll('.bgmBtn').forEach(b=>{b.textContent=BGM.on?'♪ BGM オン':'♪ BGM オフ'; b.classList.toggle('off',!BGM.on);});}
document.querySelectorAll('.bgmBtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation(); bgmSet(!BGM.on);}));
/* phones only allow sound after a touch: start (or wake) the music on the first tap */
function bgmWake(){ if(!BGM.on) return; const c=bgmCtx(); if(!c) return; if(c.state!=='running') c.resume().catch(()=>{}); if(!BGM.cur) bgmPlay(bgmScene()); }
['pointerdown','touchend','keydown'].forEach(t=>document.addEventListener(t,bgmWake,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!BGM.ctx) return; if(document.hidden) BGM.ctx.suspend().catch(()=>{}); else if(BGM.on) BGM.ctx.resume().catch(()=>{});});
bgmLabel();
/* ---------- main loop ---------- */
let last=performance.now(), acc=0, started=false;
let lastPlay=performance.now();

function loop(now){
  if(started&&S&&!document.hidden){const d=now-lastPlay; if(d>0&&d<2000) S.playMs=(S.playMs||0)+d;} lastPlay=now;
  const dt=Math.min(0.05,(now-last)/1000); last=now;

    else {
      if(!paused&&ov.hidden&&!buildMode&&$('#side').hidden&&S.speed>0){ /* time stops while any menu or window is open */acc+=dt*1000; const need=DAY_MS/S.speed; if(acc>=need){acc=0; tick();} $('#hProg').style.width=Math.min(100,acc/need*100)+'%';}
      drawHome(dt);
